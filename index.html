<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b63"><link rel="manifest" href="./manifest.webmanifest"><title>バーコード照合</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f2f5f8;color:#17212b;margin:0 auto;padding:15px;max-width:760px}h1{color:#173b63}.box{background:#fff;border-radius:13px;padding:15px;margin:12px 0;box-shadow:0 2px 9px #0001}label{display:block;font-weight:bold;margin:10px 0 5px}input{width:100%;padding:12px;font-size:18px;border:1px solid #bbc7d2;border-radius:8px}button{padding:12px 14px;margin:5px 3px 5px 0;border:0;border-radius:8px;background:#174f80;color:white;font-size:16px;font-weight:bold}.sub{background:#586978}#reader{max-width:520px;margin:10px auto}#status{text-align:center;font-size:34px;font-weight:900;padding:18px;background:#e8edf2;border-radius:10px}#status.ok{background:#d9f5df;color:#08752b}#status.ng{background:#ffe0e0;color:#b00020}.hint{font-size:13px;color:#596875}table{border-collapse:collapse;width:100%;font-size:12px;word-break:break-all}td,th{padding:7px 4px;border-bottom:1px solid #dce3e9;text-align:left}th{background:#edf2f6}
</style></head><body><h1>バーコード照合</h1>
<section class="box"><label>作業者ID</label><input id="worker" placeholder="作業者IDを入力／読み取り"><button id="keep" class="sub">IDを保持</button><button id="clear" class="sub">IDをクリア</button></section>
<section class="box"><b id="step">① バーコード1を読み取ってください</b><div id="reader"></div><button id="start">カメラ起動</button><button id="stop" class="sub" disabled>停止</button><label>バーコード1</label><input id="c1"><label>バーコード2</label><input id="c2"><button id="check">照合</button><button id="reset" class="sub">次の照合</button><div id="status">待機中</div><p id="msg" class="hint">初回はオンラインでページを開いて読み取りエンジンを保存してください。</p></section>
<section class="box"><h2>履歴（最新10件）</h2><button id="export">CSVを書き出す</button><button id="importBtn" class="sub">CSVを取り込む</button><input id="file" type="file" accept=".csv,text/csv" hidden><p class="hint">履歴は端末内に保存。CSVを共有し、受け取った側で取り込めます。</p><div style="overflow-x:auto"><table><thead><tr><th>日時</th><th>作業者</th><th>バーコード1</th><th>バーコード2</th><th>判定</th></tr></thead><tbody id="hist"></tbody></table></div></section>
<script src="./html5-qrcode.min.js"></script><script>
(()=>{const $=id=>document.getElementById(id),K="bc_records_v1";let data=[];try{data=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){}let qr=null,running=false,target=1;
function save(){localStorage.setItem(K,JSON.stringify(data));draw()}function draw(){$("hist").innerHTML="";data.slice(-10).reverse().forEach(x=>{let tr=document.createElement("tr");[x.t,x.w,x.a,x.b,x.r].forEach(v=>{let td=document.createElement("td");td.textContent=v;tr.append(td)});$("hist").append(tr)})}
function msg(cls,s,m){$("status").className=cls;$("status").textContent=s;$("msg").textContent=m||""}
function step(){$("step").textContent=target===1?"① バーコード1を読み取ってください":"② バーコード2を読み取ってください"}
async function stop(){if(qr&&running){try{await qr.stop()}catch(e){}running=false}$("start").disabled=false;$("stop").disabled=true}
function scanned(v){if(target===1){$("c1").value=v;target=2;step();stop().then(()=>msg("","バーコード1 読取完了","バーコード2を読み取るには、もう一度「カメラ起動」を押してください"))}else{$("c2").value=v;target=1;step();stop().then(check)}}
async function start(){if(!window.Html5Qrcode){msg("ng","読取エンジン未読込","オンラインで再読み込みし、初回キャッシュを完了してください");return}try{if(!qr)qr=new Html5Qrcode("reader");await qr.start({facingMode:"environment"},{fps:10,qrbox:(w,h)=>({width:Math.floor(Math.min(w,h)*.8),height:Math.floor(Math.min(w,h)*.45)})},scanned,()=>{});running=true;$("start").disabled=true;$("stop").disabled=false;msg("","カメラ読取中","バーコードを枠内に合わせてください")}catch(e){msg("ng","カメラ起動失敗",String(e))}}
function check(){let w=$("worker").value.trim(),a=$("c1").value.trim(),b=$("c2").value.trim();if(!w||!a||!b){msg("ng","入力不足","作業者IDと2つのバーコードを確認してください");return}let ok=a===b;data.push({t:new Date().toLocaleString("ja-JP"),w,a,b,r:ok?"OK":"NG"});save();msg(ok?"ok":"ng",ok?"OK":"NG",ok?"バーコード一致":"バーコード不一致")}
function cell(s){return '"'+String(s??"").replace(/"/g,'""')+'"'}
function download(file){let u=URL.createObjectURL(file),a=document.createElement("a");a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
$("start").onclick=start;$("stop").onclick=stop;$("check").onclick=check;$("reset").onclick=()=>{$("c1").value="";$("c2").value="";target=1;step();msg("","待機中","次の照合を開始できます")};
$("keep").onclick=()=>{localStorage.setItem("bc_worker",$("worker").value);localStorage.setItem("bc_keep","1");msg("","作業者IDを保持","次回起動時も引き継ぎます")};$("clear").onclick=()=>{$("worker").value="";localStorage.removeItem("bc_worker");localStorage.removeItem("bc_keep")};if(localStorage.getItem("bc_keep")==="1")$("worker").value=localStorage.getItem("bc_worker")||"";
$("export").onclick=()=>{let rows=[["日時","作業者ID","バーコード1","バーコード2","結果"],...data.map(x=>[x.t,x.w,x.a,x.b,x.r])];let f=new File(["\ufeff"+rows.map(r=>r.map(cell).join(",")).join("\r\n")],"バーコード照合履歴.csv",{type:"text/csv;charset=utf-8"});if(navigator.share&&navigator.canShare?.({files:[f]}))navigator.share({files:[f],title:f.name}).catch(()=>download(f));else download(f)};
$("importBtn").onclick=()=>$("file").click();
function parse(s){s=s.replace(/^\uFEFF/,"");let rows=[],row=[],v="",q=false;for(let i=0;i<s.length;i++){let c=s[i],n=s[i+1];if(q){if(c==='"'&&n==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===","){row.push(v);v=""}else if(c==="\n"){row.push(v);rows.push(row);row=[];v=""}else if(c!=="\r")v+=c}if(v||row.length){row.push(v);rows.push(row)}return rows}
$("file").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let rows=parse(await f.text()),seen=new Set(data.map(x=>[x.t,x.w,x.a,x.b,x.r].join("|"))),n=0;rows.slice(1).forEach(r=>{if(r.length<5)return;let x={t:r[0],w:r[1],a:r[2],b:r[3],r:r[4]},k=[x.t,x.w,x.a,x.b,x.r].join("|");if(!seen.has(k)){data.push(x);seen.add(k);n++}});save();msg("ok","CSV取込完了",n+"件追加（重複除外）")}catch(e){msg("ng","取込失敗",String(e))}e.target.value=""};
draw();step();if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));
})();
</script></body></html>
