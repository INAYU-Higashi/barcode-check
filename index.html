<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b63"><link rel="manifest" href="./manifest.webmanifest"><title>バーコード・文字照合</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f2f5f8;color:#17212b;margin:0 auto;padding:15px;max-width:760px}h1{color:#173b63}.box{background:#fff;border-radius:13px;padding:15px;margin:12px 0;box-shadow:0 2px 9px #0001}label{display:block;font-weight:bold;margin:10px 0 5px}input,textarea{width:100%;padding:12px;font-size:18px;border:1px solid #bbc7d2;border-radius:8px}button{padding:12px 14px;margin:5px 3px 5px 0;border:0;border-radius:8px;background:#174f80;color:white;font-size:16px;font-weight:bold}.sub{background:#586978}.selected{background:#08752b}#reader{max-width:520px;margin:10px auto}#status{text-align:center;font-size:34px;font-weight:900;padding:18px;background:#e8edf2;border-radius:10px}#status.ok{background:#d9f5df;color:#08752b}#status.ng{background:#ffe0e0;color:#b00020}.hint{font-size:13px;color:#596875}table{border-collapse:collapse;width:100%;font-size:12px;word-break:break-all}td,th{padding:7px 4px;border-bottom:1px solid #dce3e9;text-align:left}th{background:#edf2f6}.mode{display:flex;gap:6px}.mode button{flex:1}.preview{max-width:100%;max-height:220px;display:block;margin:8px auto}
.ocr-frame{position:relative;width:100%;height:260px;overflow:hidden;background:#111;border-radius:10px}.ocr-frame video{width:100%;height:100%;object-fit:cover}.ocr-guide{position:absolute;left:20%;top:27%;width:60%;height:46%;border:2px solid #20e060;box-shadow:0 0 0 999px #0008;pointer-events:none}
</style></head><body>
<h1>バーコード・文字照合</h1>
<section class="box"><label>作業者ID</label><input id="worker" placeholder="作業者IDを入力／読み取り"><button id="keep" class="sub">IDを保持</button><button id="clear" class="sub">IDをクリア</button></section>
<section class="box"><div class="mode"><button id="barcodeMode" class="selected">バーコード照合</button><button id="ocrMode" class="sub">文字・数字OCR照合</button></div>
<div id="barcodePanel"><b id="step">① バーコード1を読み取ってください</b><div id="reader"></div><button id="start">カメラ起動</button><button id="stop" class="sub" disabled>停止</button><label>バーコード1</label><input id="c1"><label>バーコード2</label><input id="c2"><button id="check">照合</button><button id="reset" class="sub">次の照合</button></div>
<div id="ocrPanel" hidden><b id="ocrStep">① 文字・数字1を撮影してください</b><div class="ocr-frame"><video id="ocrCamera" playsinline autoplay muted></video><div class="ocr-guide"></div></div><p class="hint">緑枠内に英数字・半角記号を合わせてください。</p><div><button id="ocrCameraStart">カメラ起動</button><button id="ocrCapture">撮影して文字認識</button><button id="ocrCameraStop" class="sub">カメラ停止</button></div><canvas id="ocrCanvas" hidden></canvas><p id="ocrBusy" class="hint"></p><div id="ocrCandidates" class="box" hidden><b>認識した文字（候補を選択）</b><div id="ocrCandidateList"></div></div><label>文字・数字1（選択結果）</label><textarea id="o1" rows="2"></textarea><button id="ocrNext">1回目を確定して2回目へ</button><label>文字・数字2（選択結果）</label><textarea id="o2" rows="2"></textarea><button id="ocrCheck">文字を照合</button><button id="ocrReset" class="sub">次の照合</button><p class="hint">カメラで撮影し、認識候補を選ぶと照合欄に反映されます。</p></div>
<div id="status">待機中</div><p id="msg" class="hint">初回はオンラインで読み取りエンジンを読み込んでください。</p></section>
<section class="box"><h2>履歴（最新10件）</h2><button id="export">CSVを書き出す</button><button id="importBtn" class="sub">CSVを取り込む</button><input id="file" type="file" accept=".csv,text/csv" hidden><p class="hint">履歴は端末内に保存。CSVを共有し、受け取った側で取り込めます。</p><div style="overflow-x:auto"><table><thead><tr><th>日時</th><th>方式</th><th>作業者</th><th>1回目</th><th>2回目</th><th>判定</th></tr></thead><tbody id="hist"></tbody></table></div></section>
<script src="./html5-qrcode.min.js"></script><script src="./tesseract.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),K="bc_records_v1";let data=[];try{data=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){}
let qr=null,running=false,target=1,ocrTarget=1,ocrWorker=null,ocrStream=null,ocrCandidates=[];
function save(){localStorage.setItem(K,JSON.stringify(data));draw()}
function draw(){$("hist").innerHTML="";data.slice(-10).reverse().forEach(x=>{let tr=document.createElement("tr");[x.t,x.m||"バーコード",x.w,x.a,x.b,x.r].forEach(v=>{let td=document.createElement("td");td.textContent=v??"";tr.append(td)});$("hist").append(tr)})}
function msg(c,s,m){$("status").className=c;$("status").textContent=s;$("msg").textContent=m||""}
function step(){$("step").textContent=target===1?"① バーコード1を読み取ってください":"② バーコード2を読み取ってください"}
async function stop(){if(qr&&running){try{await qr.stop()}catch(e){}running=false}$("start").disabled=false;$("stop").disabled=true}
function scanned(v){if(target===1){$("c1").value=v;target=2;step();stop().then(()=>msg("","バーコード1 読取完了","2回目は再度カメラ起動を押してください"))}else{$("c2").value=v;target=1;step();stop().then(check)}}
async function start(){
 if(!window.Html5Qrcode){msg("ng","読取エンジン未読込","オンラインで再読み込みしてください");return}
 try{
  if(!qr){
   const formats=[
    Html5QrcodeSupportedFormats.QR_CODE,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.CODE_93,
    Html5QrcodeSupportedFormats.CODABAR,
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.ITF,
    Html5QrcodeSupportedFormats.DATA_MATRIX,
    Html5QrcodeSupportedFormats.PDF_417,
    Html5QrcodeSupportedFormats.AZTEC
   ].filter(x=>x!==undefined);
   qr=new Html5Qrcode("reader",{formatsToSupport:formats,verbose:false});
  }
  await qr.start(
   {facingMode:"environment"},
   {fps:12,qrbox:(w,h)=>({
    width:Math.max(120,Math.floor(w*.92)),
    height:Math.max(70,Math.floor(h*.36))
   }),aspectRatio:2.4},
   scanned,
   ()=>{}
  );
  running=true;$("start").disabled=true;$("stop").disabled=false;
  msg("","カメラ読取中","バーコード全体を横長の読み取り枠内に合わせてください");
 }catch(e){msg("ng","カメラ起動失敗",String(e))}
}
function record(a,b,m){let w=$("worker").value.trim(),aa=a.trim(),bb=b.trim();if(!w||!aa||!bb){msg("ng","入力不足","作業者IDと2つの読み取り結果を確認してください");return}let ok=aa===bb;data.push({t:new Date().toLocaleString("ja-JP"),w,a:aa,b:bb,r:ok?"OK":"NG",m});save();msg(ok?"ok":"ng",ok?"OK":"NG",ok?"完全一致":"不一致")}
function check(){record($("c1").value,$("c2").value,"バーコード")}
function setMode(m){$("barcodePanel").hidden=m!=="barcode";$("ocrPanel").hidden=m!=="ocr";$("barcodeMode").className=m==="barcode"?"selected":"sub";$("ocrMode").className=m==="ocr"?"selected":"sub";msg("","待機中",m==="ocr"?"文字・数字を撮影して照合します":"バーコードを読み取って照合します")}
async function startOcrCamera(){try{ocrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});$("ocrCamera").srcObject=ocrStream;await $("ocrCamera").play();$("ocrBusy").textContent="文字を画面に合わせてください。"}catch(e){$("ocrBusy").textContent="カメラ起動失敗："+String(e)}}
function stopOcrCamera(){if(ocrStream){ocrStream.getTracks().forEach(t=>t.stop());ocrStream=null}$("ocrCamera").srcObject=null}
function applyCandidate(i){if(ocrCandidates[i]!==undefined)$(ocrTarget===1?"o1":"o2").value=ocrCandidates[i]}
function showCandidates(lines){ocrCandidates=lines.filter(x=>x.trim());let box=$("ocrCandidateList");box.innerHTML="";$("ocrCandidates").hidden=!ocrCandidates.length;if(!ocrCandidates.length){$("ocrBusy").textContent="認識できません。明るさやピントを確認してください。";return}ocrCandidates.forEach((v,i)=>{let lab=document.createElement("label"),r=document.createElement("input");r.type="radio";r.name="ocrCandidate";r.value=i;r.style.width="auto";lab.style.cssText="display:flex;padding:8px;border-bottom:1px solid #ddd;word-break:break-word";lab.append(r,document.createTextNode(v));box.append(lab);if(i===0)r.checked=true});applyCandidate(0)}
function prepareOcrCrop(video,canvas){
  const vw=video.videoWidth,vh=video.videoHeight;
  const frame=$("ocrCamera").parentElement;
  const vr=video.getBoundingClientRect(),gr=frame.querySelector(".ocr-guide").getBoundingClientRect();
  if(!vw||!vh||!vr.width||!vr.height)throw Error("カメラ映像を取得できません");
  // 緑枠の画面上の位置を、object-fit:cover後の映像から元映像座標へ正確に変換
  const scale=Math.max(vr.width/vw,vr.height/vh);
  const renderedW=vw*scale,renderedH=vh*scale;
  const offsetX=(vr.width-renderedW)/2,offsetY=(vr.height-renderedH)/2;
  let sx=(gr.left-vr.left-offsetX)/scale;
  let sy=(gr.top-vr.top-offsetY)/scale;
  let sw=gr.width/scale,sh=gr.height/scale;
  sx=Math.max(0,Math.min(vw-1,sx));sy=Math.max(0,Math.min(vh-1,sy));
  sw=Math.max(1,Math.min(vw-sx,sw));sh=Math.max(1,Math.min(vh-sy,sh));
  const zoom=4;
  canvas.width=Math.max(1,Math.round(sw*zoom));canvas.height=Math.max(1,Math.round(sh*zoom));
  const ctx=canvas.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(video,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
  // グレースケール化＋コントラスト補正
  const image=ctx.getImageData(0,0,canvas.width,canvas.height),d=image.data;
  for(let i=0;i<d.length;i+=4){
    const y=.299*d[i]+.587*d[i+1]+.114*d[i+2];
    const adjusted=Math.max(0,Math.min(255,(y-100)*1.8+128));
    d[i]=d[i+1]=d[i+2]=adjusted;
  }
  ctx.putImageData(image,0,0);
}
async function captureOcr(){
  let v=$("ocrCamera");
  if(!ocrStream||!v.videoWidth){$("ocrBusy").textContent="先にカメラ起動を押してください。";return}
  $("ocrBusy").textContent="画像を調整しています…";
  try{
    if(!window.Tesseract)throw Error("OCRライブラリ未読込。オンラインで再読み込みしてください。");
    const c=$("ocrCanvas");prepareOcrCrop(v,c);
    if(!ocrWorker){
      ocrWorker=await Tesseract.createWorker("eng",1,{logger:m=>{
        if(m.status==="recognizing text")$("ocrBusy").textContent="文字認識中 "+Math.round((m.progress||0)*100)+"%";
      }});
      await ocrWorker.setParameters({
        tessedit_char_whitelist:"0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!#$%&'()*+,-./:;<=>?@[\\]^_`{|}~",
        tessedit_pageseg_mode:"6",
        preserve_interword_spaces:"1"
      });
    }
    $("ocrBusy").textContent="文字認識中…";
    const r=await ocrWorker.recognize(c);
    const lines=(r.data.text||"").split(/\r?\n/)
      .map(x=>x.replace(/[^0-9A-Za-z!#$%&'()*+,-./:;<=>?@[\\]^_`{|}~]/g,"").trim())
      .filter(Boolean);
    showCandidates(lines);
    $("ocrBusy").textContent=lines.length?"候補を選択してください。":"認識できません。ピント・明るさ・文字の大きさを確認してください。";
  }catch(e){$("ocrBusy").textContent="OCR失敗："+String(e)}
}
$("barcodeMode").onclick=()=>setMode("barcode");$("ocrMode").onclick=()=>setMode("ocr");$("start").onclick=start;$("stop").onclick=stop;$("check").onclick=check;$("reset").onclick=()=>{$("c1").value="";$("c2").value="";target=1;step();msg("","待機中","次の照合を開始できます")};
$("ocrCameraStart").onclick=startOcrCamera;$("ocrCameraStop").onclick=stopOcrCamera;$("ocrCapture").onclick=captureOcr;$("ocrCandidateList").onchange=e=>{if(e.target.name==="ocrCandidate")applyCandidate(Number(e.target.value))};$("ocrNext").onclick=()=>{if(!$("o1").value.trim()){msg("ng","1回目未入力","先に撮影して候補を選択してください");return}ocrTarget=2;$("ocrCandidates").hidden=true;$("ocrStep").textContent="② 文字・数字2を撮影してください";$("ocrBusy").textContent="2回目を撮影してください。"};$("ocrCheck").onclick=()=>record($("o1").value,$("o2").value,"文字OCR");$("ocrReset").onclick=()=>{$("o1").value="";$("o2").value="";ocrTarget=1;$("ocrCandidates").hidden=true;$("ocrCandidateList").innerHTML="";$("ocrBusy").textContent="";$("ocrStep").textContent="① 文字・数字1を撮影してください";stopOcrCamera();msg("","待機中","次の照合を開始できます")};
$("keep").onclick=()=>{localStorage.setItem("bc_worker",$("worker").value);localStorage.setItem("bc_keep","1");msg("","作業者IDを保持","次回起動時も引き継ぎます")};$("clear").onclick=()=>{$("worker").value="";localStorage.removeItem("bc_worker");localStorage.removeItem("bc_keep")};if(localStorage.getItem("bc_keep")==="1")$("worker").value=localStorage.getItem("bc_worker")||"";
function cell(s){return '"'+String(s??"").replace(/"/g,'""')+'"'}function download(f){let u=URL.createObjectURL(f),a=document.createElement("a");a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
$("export").onclick=()=>{let rows=[["日時","作業者ID","1回目","2回目","結果","方式"],...data.map(x=>[x.t,x.w,x.a,x.b,x.r,x.m||"バーコード"])];let f=new File(["\ufeff"+rows.map(r=>r.map(cell).join(",")).join("\r\n")],"バーコード・文字照合履歴.csv",{type:"text/csv;charset=utf-8"});if(navigator.share&&navigator.canShare?.({files:[f]}))navigator.share({files:[f],title:f.name}).catch(()=>download(f));else download(f)};
$("importBtn").onclick=()=>$("file").click();function parse(s){s=s.replace(/^\uFEFF/,"");let rows=[],row=[],v="",q=false;for(let i=0;i<s.length;i++){let c=s[i],n=s[i+1];if(q){if(c==='"'&&n==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===","){row.push(v);v=""}else if(c==="\n"){row.push(v);rows.push(row);row=[];v=""}else if(c!=="\r")v+=c}if(v||row.length){row.push(v);rows.push(row)}return rows}
$("file").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let rows=parse(await f.text()),seen=new Set(data.map(x=>[x.t,x.w,x.a,x.b,x.r].join("|"))),n=0;rows.slice(1).forEach(r=>{if(r.length<5)return;let x={t:r[0],w:r[1],a:r[2],b:r[3],r:r[4],m:r[5]||"バーコード"},k=[x.t,x.w,x.a,x.b,x.r].join("|");if(!seen.has(k)){data.push(x);seen.add(k);n++}});save();msg("ok","CSV取込完了",n+"件追加（重複除外）")}catch(e){msg("ng","取込失敗",String(e))}e.target.value=""};
draw();step();if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));
})();
</script></body></html>
