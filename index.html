<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17365d"><title>バーコード照合</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f5f8;color:#17202a}header{margin:0 -14px 14px;padding:18px;background:#17365d;color:white;text-align:center;font-size:22px;font-weight:bold}main{max-width:560px;margin:auto}.panel{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}label{display:block;font-weight:bold;margin:10px 0 6px}input{width:100%;font-size:17px;padding:12px;border:1px solid #bac4d0;border-radius:9px}.status{padding:18px;text-align:center;border-radius:12px;font-size:28px;font-weight:800;margin:12px 0}.wait{background:#edf1f5;color:#4c5968}.ok{background:#d9f2df;color:#12652a}.ng{background:#ffe0df;color:#a31616}button{border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:bold}.primary{background:#1769aa;color:white;width:100%}.secondary{background:#e8edf3;color:#17365d}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}#reader{width:100%;overflow:hidden;border-radius:10px;margin-top:10px}.small{font-size:13px;color:#5d6875;line-height:1.5}.history{padding:9px 0;border-bottom:1px solid #e5e9ef;font-size:14px;overflow-wrap:anywhere}.tagok{color:#16803b;font-weight:bold}.tagng{color:#c5221f;font-weight:bold}.filebtn{display:block;background:#e8edf3;color:#17365d;padding:12px;border-radius:9px;text-align:center;font-weight:bold;margin-top:8px}button:disabled{opacity:.45}</style></head><body><header>バーコード照合</header><main>
<section class="panel"><label>作業者ID</label><input id="worker" placeholder="作業者IDを入力" autocomplete="off"><div class="small">作業者IDを入力してから読み取りを開始してください。</div><div id="step" class="status wait">バーコード1を読み取ってください</div><div id="reader"></div><div class="actions"><button id="start" class="primary">カメラで読み取る</button><button id="stop" class="secondary" disabled>カメラ停止</button></div><label>バーコード1</label><input id="code1" readonly placeholder="未読み取り"><label>バーコード2</label><input id="code2" readonly placeholder="未読み取り"><div id="result" class="status wait">照合待ち</div><button id="reset" class="secondary" style="width:100%">次の照合へ</button></section>
<section class="panel"><strong>履歴の送信・管理</strong><p class="small">作業者：照合後に「履歴を管理者へ送信」を押し、LINE・メールなどでCSVを送ってください。管理者：受け取ったCSVを下から取り込むと履歴に追加されます。</p><button id="share" class="primary">履歴を管理者へ送信</button><label class="filebtn" for="importFile">管理者：受け取ったCSVを取り込む</label><input id="importFile" type="file" accept=".csv,text/csv" style="display:none"><div id="importMsg" class="small"></div><div class="actions"><button id="export" class="secondary">CSVを保存</button><button id="clear" class="secondary">この端末の履歴を消去</button></div></section>
<section class="panel"><strong>直近10件の履歴</strong><div id="history" class="small" style="margin-top:8px">履歴はありません</div></section><p class="small">※カメラ利用にはHTTPSで公開されたページが必要です。履歴は端末内に保存されます。管理者への共有は手動送信です。</p></main>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>
const $=id=>document.getElementById(id);let scanner=null,active=false,stage=1,code1='',code2='';const KEY='barcodeMatchHistoryV1';
function hist(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}function save(a){localStorage.setItem(KEY,JSON.stringify(a));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let a=hist().slice(0,10);$('history').innerHTML=a.length?a.map(x=>`<div class="history">${esc(x.time)}　${esc(x.worker)}<br>① ${esc(x.code1)}<br>② ${esc(x.code2)}　<span class="${x.result==='OK'?'tagok':'tagng'}">${x.result}</span></div>`).join(''):'履歴はありません'}
function msg(t,c){$('step').textContent=t;$('step').className='status '+c}
function csvText(rows){let q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return '\\uFEFF'+[['日時','作業者ID','バーコード1','バーコード2','結果'],...rows.map(x=>[x.time,x.worker,x.code1,x.code2,x.result])].map(r=>r.map(q).join(',')).join('\\r\\n')}
function csvBlob(){return new Blob([csvText(hist())],{type:'text/csv;charset=utf-8'})}
async function stop(){if(scanner&&active){try{await scanner.stop()}catch(e){}active=false}$('start').disabled=false;$('stop').disabled=true}
async function start(){if(!$('worker').value.trim()){alert('作業者IDを入力してください');return}if(!window.Html5Qrcode){alert('読み取り機能を読み込めません。ネット接続を確認してください');return}if(!scanner)scanner=new Html5Qrcode('reader');try{let cams=await Html5Qrcode.getCameras();if(!cams.length)throw Error('カメラが見つかりません');let cam=cams.find(c=>/back|rear|environment/i.test(c.label))||cams[cams.length-1];await scanner.start(cam.id,{fps:10,qrbox:{width:Math.min(280,innerWidth-80),height:150},aspectRatio:1.6},accept,()=>{});active=true;$('start').disabled=true;$('stop').disabled=false}catch(e){alert('カメラを起動できません。HTTPS接続とカメラの許可を確認してください。\\n'+e)}}
function accept(v){if(stage===1){code1=v;$('code1').value=v;stage=2;msg('バーコード2を読み取ってください','wait')}else if(stage===2){code2=v;$('code2').value=v;let ok=code1===code2;$('result').textContent=ok?'OK':'NG';$('result').className='status '+(ok?'ok':'ng');let a=hist();a.unshift({time:new Date().toLocaleString('ja-JP'),worker:$('worker').value.trim(),code1,code2,result:ok?'OK':'NG'});save(a);stage=3;msg('照合完了','wait');stop()}}
$('start').onclick=start;$('stop').onclick=stop;$('reset').onclick=async()=>{await stop();stage=1;code1='';code2='';$('code1').value='';$('code2').value='';$('result').textContent='照合待ち';$('result').className='status wait';msg('バーコード1を読み取ってください','wait')};
$('export').onclick=()=>download(csvBlob());
function download(blob){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='バーコード照合履歴.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('share').onclick=async()=>{let f=new File([csvBlob()],'バーコード照合履歴.csv',{type:'text/csv'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'バーコード照合履歴',text:'照合履歴を送ります。'})}catch(e){if(e.name!=='AbortError')alert('共有できませんでした。CSV保存をお試しください')}}else{download(csvBlob());alert('この端末ではファイル共有に対応していないため、CSVを保存しました。保存したファイルをLINEやメールに添付してください。')}};
function parseCSV(s){let rows=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(q){if(c==='"'&&s[i+1]==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else{if(c==='"')q=true;else if(c===','){row.push(v);v=''}else if(c==='\\n'){row.push(v.replace(/\\r$/,''));rows.push(row);row=[];v=''}else v+=c}}if(v.length||row.length){row.push(v);rows.push(row)}return rows}
$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let txt=(await f.text()).replace(/^\\uFEFF/,'');let rows=parseCSV(txt);let incoming=[];for(let r of rows.slice(1)){if(r.length>=5&&r[0]&&r[1])incoming.push({time:r[0],worker:r[1],code1:r[2],code2:r[3],result:r[4]})}let old=hist(),keys=new Set(old.map(x=>[x.time,x.worker,x.code1,x.code2,x.result].join('|'))),added=0;for(let x of incoming){let k=[x.time,x.worker,x.code1,x.code2,x.result].join('|');if(!keys.has(k)){old.push(x);keys.add(k);added++}}old.sort((a,b)=>String(b.time).localeCompare(String(a.time)));save(old);$('importMsg').textContent=added+'件を追加しました（重複は除外）。'}catch(err){$('importMsg').textContent='CSVを読み込めませんでした。アプリから出力した履歴CSVを選択してください。'}e.target.value=''};
$('clear').onclick=()=>{if(confirm('この端末の履歴をすべて削除します。よろしいですか？'))save([])};render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
